<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 260 160"
  width="260"
  height="160"
>
  <title>Running raptor silhouette</title>

  <style>
    .raptor {
      fill: #245b86;
    }

    .body-bounce {
      animation: bounce 0.32s ease-in-out infinite;
    }

    .tail {
      transform-origin: 119px 76px;
      animation: tail-balance 0.64s ease-in-out infinite;
    }

    .leg {
      transform-origin: 137px 85px;
      animation: stride 0.64s ease-in-out infinite;
    }

    .leg-back {
      animation-delay: -0.32s;
    }

    .shin {
      transform-origin: 151px 111px;
      animation: knee 0.64s ease-in-out infinite;
    }

    .leg-back .shin {
      animation-delay: -0.32s;
    }

    .arm {
      transform-origin: 173px 75px;
      animation: arm-balance 0.64s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes stride {
      0%, 100% {
        transform: rotate(-34deg);
      }

      50% {
        transform: rotate(38deg);
      }
    }

    @keyframes knee {
      0%, 100% {
        transform: rotate(12deg);
      }

      25% {
        transform: rotate(-12deg);
      }

      60% {
        transform: rotate(62deg);
      }

      80% {
        transform: rotate(40deg);
      }
    }

    @keyframes tail-balance {
      0%, 100% {
        transform: rotate(-2deg);
      }

      50% {
        transform: rotate(3deg);
      }
    }

    @keyframes arm-balance {
      0%, 100% {
        transform: rotate(-7deg);
      }

      50% {
        transform: rotate(8deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .body-bounce,
      .tail,
      .leg,
      .shin,
      .arm {
        animation: none;
      }

      .leg-back {
        transform: rotate(30deg);
      }
    }
  </style>

  <g class="raptor body-bounce">

    <!-- FAR LEG -->
    <g class="leg leg-back">
      <path d="
        M 128,78
        C 139,75 151,88 157,103
        C 161,112 154,119 147,115
        L 127,96
        Z
      "/>

      <g class="shin">
        <path d="
          M 146,105
          Q 156,103 157,113
          L 143,137
          L 164,140
          Q 170,141 170,145
          L 137,145
          Q 130,144 133,136
          L 146,113
          Z
        "/>

        <!-- Raised sickle claw -->
        <path d="
          M 145,138
          Q 151,123 159,130
          Q 153,129 153,140
          Z
        "/>
      </g>
    </g>

    <!-- LONG, FLATTER TAIL -->
    <path class="tail" d="
      M 130,67
      C 107,65 82,58 57,55
      C 37,52 20,53 9,57
      C 26,55 43,59 62,65
      C 84,73 105,84 128,87
      Z
    "/>

    <!-- LOW BODY, FORWARD NECK, AND HEAD -->
    <path d="
      M 112,72
      C 123,61 143,61 162,66
      C 174,69 184,67 194,60
      L 207,51
      C 215,46 226,47 234,51
      L 248,56
      Q 252,58 249,63
      L 245,67
      L 221,65
      Q 212,65 206,70
      L 191,82
      C 179,94 163,98 146,96
      L 120,90
      Q 108,85 112,72
      Z
    "/>

    <!-- FOLDED FOREARMS -->
    <g class="arm">
      <path d="
        M 174,72
        Q 180,74 185,87
        L 200,82
        Q 205,80 207,85
        L 209,95
        L 205,92
        L 203,88
        L 188,97
        Q 182,100 178,94
        L 167,79
        Z
      "/>

      <path d="
        M 197,85
        L 201,97
        L 197,94
        L 193,87
        Z
      "/>
    </g>

    <!-- NEAR LEG -->
    <g class="leg">
      <path d="
        M 128,78
        C 139,75 151,88 157,103
        C 161,112 154,119 147,115
        L 127,96
        Z
      "/>

      <g class="shin">
        <path d="
          M 146,105
          Q 156,103 157,113
          L 143,137
          L 164,140
          Q 170,141 170,145
          L 137,145
          Q 130,144 133,136
          L 146,113
          Z
        "/>

        <!-- Raised sickle claw -->
        <path d="
          M 145,138
          Q 151,123 159,130
          Q 153,129 153,140
          Z
        "/>
      </g>
    </g>

  </g>
</svg>